name: alice
description: Scapia fork of Alice HTTP Inspector — notification, shake, and export stripped; Dio adapter merged in.
version: 1.0.0
homepage: https://github.com/scapia/scapia-alice
repository: https://github.com/scapia/scapia-alice

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  rxdart: ^0.28.0
  collection: ^1.19.1
  equatable: ^2.0.7
  dio: ^5.8.0+1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  lints: ^5.1.1
  test: ^1.25.15
  mocktail: ^1.0.4
